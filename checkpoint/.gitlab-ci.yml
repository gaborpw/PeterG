# Checkpoint CI.
#
# Every job is guarded by `rules: exists:` so the pipeline is green on a repo that
# is still only a spec, and each stage switches itself on the moment its component
# lands. Nothing here needs editing when you add api/, app/ or web/.

include:
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - verify
  - test
  - build

default:
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# --- verify -----------------------------------------------------------------

commit-lint:
  stage: verify
  image: alpine:3
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apk add --no-cache git
  script:
    - |
      pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: .+'
      failed=0
      range="$CI_MERGE_REQUEST_DIFF_BASE_SHA..$CI_COMMIT_SHA"
      while IFS= read -r subject; do
        case "$subject" in
          "Merge "*) continue ;;
        esac
        if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
          echo "Not a Conventional Commit: $subject"
          failed=1
        fi
      done <<SUBJECTS
      $(git log --format=%s "$range")
      SUBJECTS
      if [ "$failed" -ne 0 ]; then
        echo
        echo "Expected e.g. 'feat(api): add playthrough status transitions'"
        echo "See CONTRIBUTING.md."
        exit 1
      fi
      echo "All commit subjects are well formed."

go-lint:
  stage: verify
  image: golang:1
  rules:
    - exists: [api/go.mod]
  script:
    - cd api
    - test -z "$(gofmt -l .)" || { echo "gofmt found unformatted files:"; gofmt -l .; exit 1; }
    - go vet ./...

node-lint:
  stage: verify
  image: node:lts
  rules:
    - exists: [app/package.json, web/package.json]
  script:
    - for d in app web; do
        if [ -f "$d/package.json" ]; then
          (cd "$d" && npm ci && npm run lint --if-present && npm run typecheck --if-present);
        fi;
      done

# --- test -------------------------------------------------------------------

go-test:
  stage: test
  image: golang:1
  rules:
    - exists: [api/go.mod]
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: checkpoint_test
    POSTGRES_USER: checkpoint
    POSTGRES_PASSWORD: checkpoint
    DATABASE_URL: "postgres://checkpoint:checkpoint@postgres:5432/checkpoint_test?sslmode=disable"
  script:
    - cd api
    - go test -race -coverprofile=coverage.txt ./...
    - go tool cover -func=coverage.txt | tail -1
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    paths: [api/coverage.txt]
    expire_in: 1 week

node-test:
  stage: test
  image: node:lts
  rules:
    - exists: [app/package.json, web/package.json]
  script:
    - for d in app web; do
        if [ -f "$d/package.json" ]; then
          (cd "$d" && npm ci && npm test --if-present);
        fi;
      done

# --- build ------------------------------------------------------------------

go-build:
  stage: build
  image: golang:1
  rules:
    - exists: [api/go.mod]
  script:
    - cd api
    - go build -o bin/ ./...
  artifacts:
    paths: [api/bin/]
    expire_in: 1 day

web-build:
  stage: build
  image: node:lts
  rules:
    - exists: [web/package.json]
  script:
    - cd web
    - npm ci
    - npm run build
